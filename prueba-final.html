<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACTA CERO — Prueba del final</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=114">
</head>
<body>
<div id="ds">
  <div class="screen" id="topS">
    <div id="stage" class="pos-negro">
      <canvas id="bg" width="256" height="192"></canvas>
      <div id="sprite"><canvas id="spr" width="256" height="192"></canvas></div>
      <canvas id="desk" width="256" height="192"></canvas>
      <div id="cap"></div>
      <div id="dim"></div>
      <div id="tag"></div>
      <div id="flash"></div>
      <div class="ov" id="bubble"></div>
      <div class="ov" id="tcard"></div>
      <div class="ov" id="loc"><div></div></div>
      <div class="ov" id="verdict"></div>
      <div class="ov" id="gavel"></div>
      <div id="mira"></div>
      <div id="verPrueba"></div>
    </div>
    <div id="health"></div>
    <div id="evpanel"><div class="pic"></div><div class="tx"><div class="nm"></div><div class="ds"></div></div></div>
    <div id="evbox" class="R"></div>
    <div id="box"><div id="name"></div><div id="text"></div><div id="next">▼</div></div>
  </div>
  <div class="screen" id="botS">
    <div id="bar"><div id="hudlabel"></div><div id="barR"><button id="muteBtn" title="Sonido">🔊</button><button id="saveBtn" title="Guardar">💾</button><button id="recBtn" aria-label="Expediente" title="Expediente"></button></div></div>
    <div id="toast"></div>
    <div id="controls"></div>
    <div id="modal"><div id="mbox"></div></div>
  </div>
  <div id="title">
    <h1><small id="casoSub">CASO 1 · LA SIRENA DEL PUERTO</small>ACTA CERO</h1>
    <div id="casoSel"></div>
    <p id="casoIntro">Valparaíso. Un defensor en su primer juicio. Y un cuadro de casi dos metros que habría salido por una ventana de sesenta centímetros.</p>
    <button class="gold" id="contBtn" style="display:none">▶ Continuar partida</button>
    <div id="saltos" style="display:flex;flex-wrap:wrap;gap:1.2cqw;justify-content:center;margin:1cqw 0"></div>
    <button class="gold" id="startBtn">▶ Nueva partida</button>
    <button id="musBtn">🎵 Mi música</button>
    <div id="musPanel"></div>
    <div class="hint">Activa el sonido · toca la pantalla de abajo para avanzar</div>
  </div>
</div>
<script src="js/casos.js?v=114"></script>
<script src="casos/caso1.js?v=114"></script>
<script src="casos/caso2.js?v=114"></script>
<script src="js/audio.js?v=114"></script>
<script src="js/sprites.js?v=114"></script>
<script src="assets/hd/atlas.js?v=114"></script>
<script src="js/assets.js?v=114"></script>
<script src="js/engine.js?v=114"></script>
<script src="js/investigacion.js?v=114"></script>
<script src="js/musica.js?v=114"></script>
<script>
/* Versión de prueba: salta directo al veredicto y la escena final del Caso 1. No toca la partida guardada. */
saveGame=function(){ return true; }; clearSave=function(){};
$("contBtn").style.display="none";
if($("finBtn")) $("finBtn").onclick=()=>{
  selectCase("caso1"); saveGame=function(){ return true; };
  initAudio(); unlockMusic(); if(AC&&AC.state==="suspended") AC.resume();
  $("title").style.display="none"; resetGame();
  Object.values(EVX).forEach(e=>EVIDENCE.push(e));      // el expediente completo, como al final del juicio
  G.nocap=true; music("corte");
  pc=SCRIPT.findIndex(s=>s.cmd==="verdict")-1; checkpoint=pc; run();
};
/* Atajos: saltar a un momento del Caso 1 para mirarlo (con el expediente que corresponde a ese punto) */
const SALTOS=[
  {caso:"caso2", t:"🔎 Caso 2: Estuardo declara", ev:["pistola","autopsia","video","libro","plano","taza","pastillas","fotomadre","cajon"], paso:()=>SCRIPT.findIndex(s=>s.who==="fiscal"&&/llama al investigador/.test(s.text||""))},
  {caso:"caso2", t:"🔑 Caso 2: Qué ocurrió después", ev:["pistola","autopsia","video","libro","plano","taza","pastillas","fotomadre","cajon"], paso:()=>SCRIPT.findIndex(s=>s.cmd==="cross"&&s.ref==="e2")},
  {caso:"caso2", t:"❓ Caso 2: Penna interroga a Tadeo", ev:["pistola","autopsia","video","libro","plano","taza","pastillas","fotomadre","cajon"].concat(["llave","bala9"]), musica:"suspenso", paso:()=>SCRIPT.findIndex(s=>s.cmd==="direct"&&s.ref==="p_tadeo")-4},
  {caso:"caso2", t:"🧳 Caso 2: Cómo llegué a la casona", ev:["pistola","autopsia","video","libro","plano","taza","pastillas","fotomadre","cajon","llave","bala9"], paso:()=>SCRIPT.findIndex(s=>s.cmd==="cross"&&s.ref==="t1")},
  {caso:"caso2", t:"🔭 Caso 2: Aurelio declara", ev:["pistola","autopsia","video","libro","plano","taza","pastillas","fotomadre","cajon","llave","bala9"], paso:()=>SCRIPT.findIndex(s=>s.who==="fiscal"&&/Aurelio Mirón, vecino/.test(s.text||""))},
  {caso:"caso2", t:"🏥 Caso 2: Chayo y las letras de la foto", ev:["pistola","autopsia","video","libro","plano","taza","pastillas","fotomadre","cajon","llave","bala9"], paso:()=>SCRIPT.findIndex(s=>s.cmd==="invest"&&s.ref==="dia2")},
  {caso:"caso2", t:"🧢 Caso 2: Tadeo en el locutorio (la carta)", ev:["pistola","autopsia","video","libro","plano","taza","pastillas","fotomadre","cajon","llave","bala9"],
   pre:()=>{ Object.assign(G.flags,{juicio1:1,foto_leonel:1,foto_camioneta:1,p92:1,maletin:1,chayo1:1,edu_denuncia:1});
     G.notes["desc:fotomadre"]="Foto antigua de una mujer joven en Puerto Williams. Al reverso, a contraluz: «Leonel y yo, 2002».";
     G.inv={ref:"dia2", place:"locutorio", seen:{"in:hospital":1,"in:comisaria":1}, reloj:50, knownInit:1, known:{hospital:1,comisaria:1,locutorio:1}}; },
   paso:()=>SCRIPT.findIndex(s=>s.cmd==="invest"&&s.ref==="dia2")},
  {caso:"caso2", t:"🏚️ Caso 2: La casona (la bala y Ricky)", ev:["pistola","autopsia","video","libro","plano","taza","pastillas","fotomadre","cajon","llave","bala9","carta"],
   pre:()=>{ Object.assign(G.flags,{juicio1:1,foto_leonel:1,foto_camioneta:1,p92:1,maletin:1,chayo1:1,edu_denuncia:1,molestia:1,l_foto:1,carta_tadeo:1});
     G.notes["desc:fotomadre"]="Foto antigua de una mujer joven en Puerto Williams. Al reverso, a contraluz: «Leonel y yo, 2002».";
     G.inv={ref:"dia2", place:"casona", seen:{"in:hospital":1,"in:comisaria":1,"in:locutorio":1}, reloj:75, knownInit:1, known:{hospital:1,comisaria:1,locutorio:1,casona:1}}; },
   paso:()=>SCRIPT.findIndex(s=>s.cmd==="invest"&&s.ref==="dia2")},
  {caso:"caso2", t:"🏢 Caso 2: Oficinas de Plusvalía", ev:["pistola","autopsia","video","libro","plano","taza","pastillas","fotomadre","cajon","llave","bala9","carta","bala38"],
   pre:()=>{ Object.assign(G.flags,{juicio1:1,foto_leonel:1,foto_camioneta:1,p92:1,maletin:1,chayo1:1,edu_denuncia:1,molestia:1,l_foto:1,carta_tadeo:1,ricky_llega:1,k1:1,k2:1,k3:1,k4:1,ricky_fue:1,oye_malva:1,o1:1,o2:1,malva_foto:1,ir_plusvalia:1});
     G.notes["desc:fotomadre"]="Foto antigua de una mujer joven en Puerto Williams. Al reverso, a contraluz: «Leonel y yo, 2002».";
     G.inv={ref:"dia2", place:"mirador", seen:{"in:hospital":1,"in:comisaria":1,"in:locutorio":1,"in:casona":1,"in:pieza":1,"in:oficinahostal":1}, reloj:150, knownInit:1, known:{hospital:1,comisaria:1,locutorio:1,casona:1,pieza:1,oficinahostal:1,mirador:1}}; },
   paso:()=>SCRIPT.findIndex(s=>s.cmd==="invest"&&s.ref==="dia2")},
];
SALTOS.forEach(sa=>{ const bt=document.createElement("button"); bt.textContent=sa.t; bt.style.fontSize="3.4cqw";
  bt.onclick=()=>{
    selectCase(sa.caso||"caso1"); saveGame=function(){ return true; };
    initAudio(); unlockMusic(); if(AC&&AC.state==="suspended") AC.resume();
    $("title").style.display="none"; resetGame();
    sa.ev.forEach(id=>{ if(!EVIDENCE.find(e=>e.id===id)) EVIDENCE.push(EVX[id]); });
    G.nocap=true; music(sa.musica||"corte");
    if(sa.pre) sa.pre();
    pc=sa.paso(); checkpoint=pc; run();
  };
  $("saltos").appendChild(bt); });
</script>
</body>
</html>
