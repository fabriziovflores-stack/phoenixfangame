<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACTA CERO — Prueba del final</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=99">
</head>
<body>
<div id="ds">
  <div class="screen" id="topS">
    <div id="stage" class="pos-negro">
      <canvas id="bg" width="256" height="192"></canvas>
      <div id="sprite"><canvas id="spr" width="256" height="192"></canvas></div>
      <canvas id="desk" width="256" height="192"></canvas>
      <div id="cap"></div>
      <div id="dim"></div>
      <div id="tag"></div>
      <div id="flash"></div>
      <div class="ov" id="bubble"></div>
      <div class="ov" id="tcard"></div>
      <div class="ov" id="loc"><div></div></div>
      <div class="ov" id="verdict"></div>
      <div class="ov" id="gavel"></div>
      <div id="mira"></div>
      <div id="verPrueba"></div>
    </div>
    <div id="health"></div>
    <div id="evpanel"><div class="pic"></div><div class="tx"><div class="nm"></div><div class="ds"></div></div></div>
    <div id="evbox" class="R"></div>
    <div id="box"><div id="name"></div><div id="text"></div><div id="next">▼</div></div>
  </div>
  <div class="screen" id="botS">
    <div id="bar"><div id="hudlabel"></div><div id="barR"><button id="muteBtn" title="Sonido">🔊</button><button id="saveBtn" title="Guardar">💾</button><button id="recBtn" aria-label="Expediente" title="Expediente"></button></div></div>
    <div id="toast"></div>
    <div id="controls"></div>
    <div id="modal"><div id="mbox"></div></div>
  </div>
  <div id="title">
    <h1><small id="casoSub">CASO 1 · LA SIRENA DEL PUERTO</small>ACTA CERO</h1>
    <div id="casoSel"></div>
    <p id="casoIntro">Valparaíso. Un defensor en su primer juicio. Y un cuadro de casi dos metros que habría salido por una ventana de sesenta centímetros.</p>
    <button class="gold" id="contBtn" style="display:none">▶ Continuar partida</button>
    <button class="gold" id="finBtn">🎬 Ver escena final (Caso 1)</button>
    <div id="saltos" style="display:flex;flex-wrap:wrap;gap:1.2cqw;justify-content:center;margin:1cqw 0"></div>
    <button class="gold" id="startBtn">▶ Nueva partida</button>
    <button id="musBtn">🎵 Mi música</button>
    <div id="musPanel"></div>
    <div class="hint">Activa el sonido · toca la pantalla de abajo para avanzar</div>
  </div>
</div>
<script src="js/casos.js?v=99"></script>
<script src="casos/caso1.js?v=99"></script>
<script src="casos/caso2.js?v=99"></script>
<script src="js/audio.js?v=99"></script>
<script src="js/sprites.js?v=99"></script>
<script src="assets/hd/atlas.js?v=99"></script>
<script src="js/assets.js?v=99"></script>
<script src="js/engine.js?v=99"></script>
<script src="js/investigacion.js?v=99"></script>
<script src="js/musica.js?v=99"></script>
<script>
/* Versión de prueba: salta directo al veredicto y la escena final del Caso 1. No toca la partida guardada. */
saveGame=function(){ return true; }; clearSave=function(){};
$("contBtn").style.display="none";
$("finBtn").onclick=()=>{
  selectCase("caso1"); saveGame=function(){ return true; };
  initAudio(); unlockMusic(); if(AC&&AC.state==="suspended") AC.resume();
  $("title").style.display="none"; resetGame();
  Object.values(EVX).forEach(e=>EVIDENCE.push(e));      // el expediente completo, como al final del juicio
  G.nocap=true; music("corte");
  pc=SCRIPT.findIndex(s=>s.cmd==="verdict")-1; checkpoint=pc; run();
};
/* Atajos: saltar a un momento del Caso 1 para mirarlo (con el expediente que corresponde a ese punto) */
const SALTOS=[
  {t:"⚖️ Zoila: el farol", ev:["ficha","luz","lona","visitas","ventana","bitacora"], paso:()=>SCRIPT.findIndex(s=>s.cmd==="cross"&&s.ref==="z1")},
  {t:"❓ Penna interroga a Llavín", ev:["ficha","luz","lona","visitas","ventana","bitacora"], paso:()=>SCRIPT.findIndex(s=>s.cmd==="direct"&&s.ref==="d1")},
  {t:"🪟 Llavín: el ladrón y la ventana", ev:["ficha","luz","lona","visitas","ventana","bitacora"], paso:()=>SCRIPT.findIndex(s=>s.cmd==="cross"&&s.ref==="g1")},
  {t:"🔦 Llavín: dentro de la sala", ev:["ficha","luz","lona","visitas","ventana","bitacora","plano1"], paso:()=>SCRIPT.findIndex(s=>s.cmd==="cross"&&s.ref==="g2")},
  {t:"🗺️ Tocar la bodega en el plano", ev:["ficha","luz","lona","visitas","ventana","bitacora","plano1"], paso:()=>SCRIPT.findIndex(s=>s.cmd==="senalar")-1},
  {t:"📻 Llavín: la ronda de las 23:35", ev:["ficha","luz","lona","visitas","ventana","bitacora","plano1","informe","parte"], paso:()=>SCRIPT.findIndex(s=>s.cmd==="cross"&&s.ref==="g3")},
  {t:"📒 La prueba que cierra el caso", ev:["ficha","luz","lona","visitas","ventana","bitacora","plano1","informe","parte"], musica:"variacion", paso:()=>SCRIPT.findIndex(s=>s.cmd==="present"&&s.answer==="bitacora")},
  {t:"🔥 Conclusión y confesión", ev:["ficha","luz","lona","visitas","ventana","bitacora","plano1","informe","parte"], musica:"suspenso", paso:()=>SCRIPT.findIndex(s=>s.cmd==="choice"&&s.who==="jueza")},
];
SALTOS.forEach(sa=>{ const bt=document.createElement("button"); bt.textContent=sa.t; bt.style.fontSize="3.4cqw";
  bt.onclick=()=>{
    selectCase("caso1"); saveGame=function(){ return true; };
    initAudio(); unlockMusic(); if(AC&&AC.state==="suspended") AC.resume();
    $("title").style.display="none"; resetGame();
    sa.ev.forEach(id=>{ if(!EVIDENCE.find(e=>e.id===id)) EVIDENCE.push(EVX[id]); });
    G.nocap=true; music(sa.musica||"corte");
    pc=sa.paso(); checkpoint=pc; run();
  };
  $("saltos").appendChild(bt); });
</script>
</body>
</html>
